<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playfold player</title>
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<div id="player"></div>
<!--
  Host this page, then point Playfold's `path` at it, for example:
    /player.html?src=https://media.example.com/a.mp3&title=Song&subtitle=Artist
  Working from a clone of the repo? Run `npm run build` and load ../dist/playfold-ui.global.js instead.
-->
<script src="https://cdn.jsdelivr.net/npm/@boy-offi9-inc/playfold@1.2.3/dist/playfold-ui.global.js"></script>
<script>
  // Which sites may supply the media and cover URLs. This stops the page from being used to play
  // anyone else's files. Same origin only by default: add your media host to the list, for example
  // 'https://media.example.com'.
  var MEDIA_ORIGINS = [location.origin];

  PlayfoldUI.mountPlayer('#player', Object.assign(PlayfoldUI.readParams(), { allowedSrcOrigins: MEDIA_ORIGINS }));
</script>
</body>
</html>
